; tdu_savepath.ini
; Test Drive Unlimited save/config folder redirector (ASI plugin)
;
; Place next to tdu_savepath.asi inside the game's "scripts" folder.

[TDU]

; Where TDU should keep its user data (config + savegame) instead of
; "%USERPROFILE%\Documents\Test Drive Unlimited".
;
;   empty        -> the folder that contains TestDriveUnlimited.exe
;   %GAME%       -> same as empty (explicit form)
;   D:\TDUData   -> any absolute path
SaveRoot=

; FlatLayout=1 : data root becomes <SaveRoot>\           -> <SaveRoot>\savegame\<profile>\...
;                (achieved by detouring the game's base-directory setter,
;                 verified against this specific exe build)
; FlatLayout=0 : data root becomes <SaveRoot>\Test Drive Unlimited\
;                -> <SaveRoot>\Test Drive Unlimited\savegame\<profile>\...
;                (only the SHGetFolderPathA redirect; zero exe-address dependency)
FlatLayout=1

; RedirectDocuments=1 : every SHGetFolderPathA(CSIDL_PERSONAL) call in the game
; returns SaveRoot. This is what relocates the folder generically; it also moves
; the crash-dump path (%s\TDU_%s.dmp) into the same tree.
RedirectDocuments=1
